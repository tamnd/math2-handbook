[project]
name = "mh"
version = "0.1.1"
description = "The builder of The Math 2.0 Handbook: tamnd/math2 as PDF, EPUB and LaTeX volumes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6", "Pillow>=10", "fonttools>=4.40"]

[project.scripts]
mh = "mh.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mh"]
