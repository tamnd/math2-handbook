# The order of chapter 3.11, eigenvalues, the characteristic polynomial and the minimal polynomial. Groups are read in order; entries in a group too.
groups:
  - title: Eigenvalues, eigenvectors and eigenspaces
    intro: >
      For a linear map $T \colon V \to V$ of a vector space over a field $F$, a scalar $\lambda$ is an eigenvalue
      when $Tv = \lambda v$ for some $v \ne 0$. The eigenvectors for $\lambda$, together with $0$, form the
      eigenspace $\ker(T - \lambda I)$, a subspace. The spectrum of an $n \times n$ matrix is its set of
      eigenvalues; it has at most $n$ elements and depends on the field.
    entries:
      - 0BQAA2BK3Q
      - 0N6960W0BV
      - 0G0RFPG8HR
      - 0XPX5NC67E
  - title: The characteristic polynomial
    intro: >
      Over a commutative ring the characteristic polynomial $p_A(t) = \det(tI_n - A)$ of an $n \times n$ matrix is
      monic of degree $n$. Similar matrices have the same one, by the product rule for determinants, so an
      endomorphism of a finite-dimensional space has a characteristic polynomial. Over a field, $\lambda$ is an
      eigenvalue exactly when $p_A(\lambda) = 0$, since this says that $A - \lambda I$ is singular. Computing
      eigenvalues thus means finding roots, and eigenvectors come from solving $(A - \lambda I) v = 0$.
    entries:
      - 0VSSPAFM2C
      - C98TZ6ZAXC
      - 053QVHF6N7
      - 7JJE96MZQY
  - title: Coefficients, trace and determinant
    intro: >
      Over a commutative ring, $p_A(t) = \sum_{k=0}^{n} (-1)^k E_k(A) \, t^{n-k}$, where $E_k(A)$ is the sum of
      the principal minors of size $k$; in particular the coefficient of $t^{n-1}$ is $-\operatorname{tr} A$ and
      the constant term is $(-1)^n \det A$. If $p_A$ splits over the field $F$ as
      $(t - \lambda_1) \cdots (t - \lambda_n)$, then $\operatorname{tr} A^k = \lambda_1^k + \dots + \lambda_n^k$
      for $k \ge 1$ and $\det A = \lambda_1 \cdots \lambda_n$.
    entries:
      - 0FRYPZ6D0X
      - 0NMXDCNNKR
      - 0C2F40MEBC
  - title: Independence and multiplicities
    intro: >
      Eigenvectors for distinct eigenvalues are linearly independent, so the eigenspaces of distinct eigenvalues
      form a direct sum. The algebraic multiplicity of $\lambda$ is its multiplicity as a root of $p_A$, and the
      geometric multiplicity is $\dim \ker(A - \lambda I)$. Over a field, for an eigenvalue of a matrix of size
      $n$, $1 \le$ geometric multiplicity $\le$ algebraic multiplicity, and the gap measures how far $A$ is from
      having a basis of eigenvectors.
    entries:
      - 0HNMFG8F8K
      - 0FY42N02DV
      - 099TWVJ909
  - title: Existence of eigenvalues, and two products
    intro: >
      Over an algebraically closed field, every linear map of a nonzero finite-dimensional space has an
      eigenvalue. A real map of a nonzero finite-dimensional space has an invariant subspace of dimension $1$ or
      $2$, and a real eigenvalue when the dimension is odd. For $A$ of size $m \times n$ and $B$ of size
      $n \times m$ over a commutative ring, $x^n p_{AB}(x) = x^m p_{BA}(x)$; over a field, $AB$ and $BA$ have the
      same nonzero eigenvalues with the same algebraic multiplicities. Left eigenvectors, the eigenvectors of
      $A^{\mathsf{T}}$ written as rows, belong to the same eigenvalues as the right ones.
    entries:
      - 08CJB2NQ92
      - KAV44BRV77
      - MCXV71BY74
      - 32M8VY9A1M
  - title: Polynomials in a map and the minimal polynomial
    intro: >
      A polynomial $f$ can be evaluated at a linear map, and $f(T) v = f(\lambda) v$ when $Tv = \lambda v$. The
      polynomials with $f(T) = 0$ form an ideal of $F[x]$. When $V$ is finite-dimensional this ideal is nonzero,
      and its monic generator is the minimal polynomial $m_T$. It divides every annihilating polynomial, and its
      roots in $F$ are exactly the eigenvalues of $T$.
    entries:
      - 0E3MV6E6MG
      - 0PBN8VEKY8
      - 03NDVCSHSB
      - 0VTAD25A3G
      - 0QF4ZEFG52
  - title: The Cayley–Hamilton theorem
    intro: >
      Over a commutative ring, every $n \times n$ matrix satisfies $p_A(A) = 0$. Over a field, it follows that the
      minimal polynomial divides the characteristic polynomial, and the characteristic polynomial divides
      $m_A^{\,n}$, so the two have the same irreducible factors. The theorem writes $A^{-1}$ and every power
      $A^k$ as polynomials in $A$ of degree less than $n$.
    entries:
      - 0F765KFC2J
      - 093X6MN6Y6
      - R4CPYXFJEQ
