  - title: Products and invertibility
    intro: >
      Over a commutative ring, $\det(AB) = \det A \det B$ for square matrices of the same size. Hence
      $\det(A^{-1}) = (\det A)^{-1}$ for invertible $A$. Over a field, a square matrix is invertible exactly when
      its determinant is nonzero; over a commutative ring, exactly when its determinant is a unit of the ring.
    entries:
