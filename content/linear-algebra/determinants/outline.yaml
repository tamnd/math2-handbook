      - HVHQ50TJB1
  - title: Maps, volume and orientation
    intro: >
      Similar matrices have the same determinant, so an endomorphism of a finite-dimensional space has a
      determinant of its own. Measured against a basis, the determinant of a family of vectors is a signed
      volume. Over $\R$ its absolute value is the factor by which a map scales volume, and its sign says
      whether the map keeps or reverses orientation.
    entries:
      - 0X0HQYSZ0K
      - 05CJSSXPR3
      - RC5BTSG8T2
      - 0QJJAQ6ZYZ
  - title: Derivative and Pfaffian
    intro: >
      Jacobi's formula differentiates a determinant along a curve of matrices, through the adjugate and the
      trace. For a skew-symmetric matrix of even size the determinant is the square of a polynomial in the
      entries, the Pfaffian.
    entries:
