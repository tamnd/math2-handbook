# The order of chapter 3.10, determinants. Groups are read in order; entries in a group too.
groups:
  - title: Small determinants
    intro: >
      For a $2 \times 2$ matrix the number $ad - bc$ is nonzero exactly when the matrix is invertible, and its
      absolute value is the area of the parallelogram spanned by the columns. The rule of Sarrus gives the six
      terms of the $3 \times 3$ case. Both are the patterns that the general definition must explain.
    entries:
      - 0ZN2J42SK7
      - 7H2P40X0MV
  - title: The definition
    intro: >
      A multilinear map of $n$ vectors is alternating when it vanishes whenever two arguments are equal; it is then
      antisymmetric, and the converse holds when $2$ is invertible. Over a commutative ring $R$ there is exactly one
      alternating multilinear map of the $n$ columns of an $n \times n$ matrix that takes the value $1$ at $I_n$.
      This is the determinant, and the Leibniz formula writes it as $\sum_{\sigma \in S_n} \operatorname{sgn}(\sigma)
      \prod_i a_{i \sigma(i)}$.
    entries:
      - 0K6CH0MT0F
      - 00KDZRW4C0
      - 016PE4VZ8Q
  - title: Rules for computing
    intro: >
      From the Leibniz formula: the determinant is linear in each row, vanishes when two rows are equal or a row is
      zero, changes sign under a swap of rows, is unchanged when a multiple of one row is added to another, equals
      the product of the diagonal entries for a triangular matrix, and satisfies $\det A^{\mathsf{T}} = \det A$, so
      every rule for rows holds for columns. Together these let Gaussian elimination compute a determinant in about
      $n^3$ operations.
    entries:
