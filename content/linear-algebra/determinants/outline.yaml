  - title: Linear maps, volume and orientation
    intro: >
      For an endomorphism $T$ of a finite-dimensional vector space, the determinant of its matrix in one basis
      used on both sides does not depend on the basis, by the product rule; this defines $\det T$. A family of
      $n$ vectors has a determinant in a basis, and a real linear map $x \mapsto Ax$ multiplies Lebesgue measure by
      $\abs{\det A}$. Two ordered bases of a real space have the same orientation when the change of basis matrix
      has positive determinant.
    entries:
