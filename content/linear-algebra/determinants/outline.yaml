  - title: Block matrices and classical identities
    intro: >
      With square diagonal blocks, a block triangular matrix has determinant $\det A \det D$; when $A$ is
      invertible, row operations on blocks give $\det \begin{pmatrix} A & B \\ C & D \end{pmatrix} = \det A
      \det(D - C A^{-1} B)$. From these and the product rule come the Vandermonde determinant
      $\prod_{i<j} (x_j - x_i)$, the Cauchy–Binet formula for $\det(AB)$ with $A$ of size $m \times n$ and $B$ of
      size $n \times m$, the identity $\det(I_m + AB) = \det(I_n + BA)$, the matrix determinant lemma,
      Sylvester's identity and Dodgson condensation. The group ends with the rank of a matrix over a field as the
      largest size of a nonzero minor.
