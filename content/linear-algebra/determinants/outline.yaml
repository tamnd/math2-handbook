  - title: Block matrices and classical identities
    intro: >
      Block triangular matrices and the Schur complement reduce a large determinant to smaller ones. The
      Vandermonde, Cauchy-Binet, Weinstein-Aronszajn and rank one update formulas follow, together with the
      identities of Sylvester and Desnanot-Jacobi that justify Dodgson condensation. The group ends with the
      description of the rank by nonzero minors.
