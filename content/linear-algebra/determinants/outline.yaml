# The order of chapter 3.10, determinants. Groups are read in order; entries in a group too.
groups:
  - title: Small determinants
    intro: >
      The formula $ad - bc$ decides whether a $2 \times 2$ system has a unique solution and gives the signed
      area of a parallelogram. The rule of Sarrus does the same for $3 \times 3$ matrices, and its attached
      examples show why no such picture works from size $4$ on.
    entries:
      - 0ZN2J42SK7
      - 7H2P40X0MV
  - title: The definition
    intro: >
      An alternating multilinear map is linear in each argument and vanishes when two arguments are equal.
      The determinant is the unique such map of the columns that takes the value $1$ at the identity matrix.
      The Leibniz formula writes it out as a signed sum over all $n!$ permutations.
    entries:
      - 0K6CH0MT0F
      - 00KDZRW4C0
      - 016PE4VZ8Q
  - title: Rules for computing
    intro: >
      These rules turn the definition into a method. Linearity in each row, the effect of the three row
      operations and the triangular rule give the standard computation by elimination. The transpose rule
      lets every statement about rows be read for columns.
    entries:
      - 0PPG793642
      - 0K4VQB7HWR
      - 09YB3WQG38
      - 0K1KKMFHYH
      - 0ZZQ2E1MTE
  - title: Products and invertibility
    intro: >
      The determinant is multiplicative, so it is a group homomorphism from invertible matrices to nonzero
      scalars. Over a field a matrix is invertible exactly when its determinant is nonzero. Over a commutative
      ring the condition is that the determinant is a unit, which settles when an integer matrix has an
      integer inverse.
    entries:
      - 04CPJ6AF00
      - 0783S9D0ZH
      - FBSAPTP1PR
      - 03Q7RE2HXR
  - title: Minors, cofactors and the adjugate
    intro: >
      A minor is the determinant of a square submatrix, and a cofactor is a signed minor of size $n - 1$.
      Laplace expansion computes a determinant from the cofactors of one row or column. The adjugate collects
      the cofactors, satisfies $A \operatorname{adj} A = \det A \cdot I$ over every commutative ring, and gives
      a formula for the inverse and Cramer's rule.
    entries:
