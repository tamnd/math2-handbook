  - title: The derivative and the Pfaffian
    intro: >
      For a differentiable matrix function $A(t)$ over $\R$ or $\C$, Jacobi's formula gives
      $\frac{d}{dt} \det A(t) = \operatorname{tr}(\operatorname{adj} A(t) \, A'(t))$, which uses the adjugate of
      the fifth group. For a skew-symmetric matrix of even size the determinant is the square of a polynomial in
      the entries, the Pfaffian, and $\operatorname{pf}(B A B^{\mathsf{T}}) = \det B \operatorname{pf} A$.
    entries:
      - 357FEAZ0Q4
      - NH5HWBPWS9
