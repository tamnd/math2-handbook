  - title: Minors, cofactors and the adjugate
    intro: >
      Deleting a row and a column leaves a minor, and the signed minors are the cofactors. For $n \ge 2$ the
      Laplace expansion computes $\det A$ along any row or column, and an expansion with the cofactors of a
      different row gives $0$. Over any commutative ring this is the identity $A \operatorname{adj} A =
      \operatorname{adj} A \, A = (\det A) I$. It gives the inverse $(\det A)^{-1} \operatorname{adj} A$ when
      $\det A$ is a unit, and Cramer's rule $x_i = \det A_i / \det A$ for a square system over a field with
      $\det A \ne 0$.
    entries:
