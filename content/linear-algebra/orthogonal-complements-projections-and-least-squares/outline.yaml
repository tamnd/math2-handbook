# The order of chapter 3.15, orthogonal complements, projections and least squares. Groups are read in order; entries in a group too.
groups:
  - title: Orthogonal complements
    intro: >
      The orthogonal complement $U^\perp$ of a subspace $U$ is the set of vectors orthogonal to all of $U$, and in
      $\R^n$ it is the null space of a matrix whose rows span $U$. In finite dimension $V = U \oplus U^\perp$ and
      $(U^\perp)^\perp = U$. For a matrix these facts pair the four fundamental subspaces: the null space is the
      complement of the row space, and the left null space is the complement of the column space.
    entries:
      - 0XJXTBCB2T
      - 0SP7P0G7KQ
      - 0PXN9G4MX1
      - GQF2KG1R1N
  - title: Projection and best approximation
    intro: >
      The decomposition $v = u + u'$ with $u \in U$ and $u' \in U^\perp$ defines the orthogonal projection
      $P_U v = u$. Its matrix is $A (A^{\mathsf{T}} A)^{-1} A^{\mathsf{T}}$ for a basis in the columns of $A$, and
      $Q Q^{\mathsf{T}}$ for an orthonormal one. The best approximation theorem says that $P_U v$ is the unique
      point of $U$ closest to $v$.
    entries:
      - 0B8KZRT28M
      - 0MCDDSCB9Z
  - title: Least squares
    intro: >
      A system $Ax = b$ with no solution has least-squares solutions: the $x$ with $Ax = P b$, where $P$ projects
      onto the column space. The normal equations $A^{\mathsf{T}} A x = A^{\mathsf{T}} b$ find them, the QR
      decomposition finds them with better accuracy, and for a system with many solutions the same geometry picks
      the shortest one.
    entries:
      - 0BYTQ4X1HC
      - 4D7MRG4D91
      - 0ERWG4NXQ9
      - QM2Y84VDX8
  - title: Angles and spaces of functions
    intro: >
      Principal angles measure how two subspaces sit relative to each other, through the singular values of
      $Q_1^{\mathsf{T}} Q_2$. The last entry carries projection into spaces of functions, where Legendre
      polynomials and Fourier coefficients give best mean-square approximations.
    entries:
      - YHVD3773AW
      - 899D63WW04
