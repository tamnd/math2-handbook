# The order of chapter 3.9, dual spaces and duality. Groups are read in order; entries in a group too.
groups:
  - title: Linear forms and hyperplanes
    intro: >
      A [linear form](/07YQ1C78G0/) on a vector space $V$ over $F$ is a linear map $V \to F$, such as a row
      vector acting on columns, the value of a polynomial at a point or the trace of a matrix. The
      [theorem on hyperplanes](/XR0EQN0H8T/) proves that the kernels of the nonzero forms are exactly the
      hyperplanes of $V$, and that two nonzero forms with the same kernel differ by a nonzero scalar factor.
    entries:
      - 07YQ1C78G0
      - XR0EQN0H8T

  - title: The dual space and its size
    intro: >
      The linear forms on $V$ make up the [dual space](/07JBSZE0V4/) $V^*$. A basis $b_1, \dots, b_n$ of $V$
      gives the [dual basis](/0ZD2CF6ZS0/) of coordinate forms, so $\dim V^* = \dim V$ in finite dimension,
      but the isomorphism $V \cong V^*$ that it gives depends on the basis. In infinite dimension the coordinate
      forms do not span $V^*$, and the [Erdős-Kaplansky theorem](/S5ET1HG2ZX/) proves
      $\dim V^* = \abs{F}^{\dim V}$, which is larger than $\dim V$.
    entries:
      - 07JBSZE0V4
      - 0ZD2CF6ZS0
      - 00889YD15K
      - S5ET1HG2ZX

  - title: The double dual and annihilators
    intro: >
      Evaluation, $v \mapsto (\varphi \mapsto \varphi(v))$, is a linear map $V \to V^{**}$ that needs no choice of
      basis; it is always injective, and an isomorphism exactly when $V$ is finite-dimensional. The
      [annihilator](/0ASHNYF7AG/) $U^0$ of a subspace $U$ is the space of forms that vanish on $U$, and for
      finite-dimensional $V$ the group proves $\dim U + \dim U^0 = \dim V$, with $U^0 \cong (V/U)^*$ and
      $V^*/U^0 \cong U^*$.
    entries:
      - 0ZJM9D7NPS
      - 0ASHNYF7AG
      - 06Q1EFVH0Q

  - title: The dual map
    intro: >
      A linear map $f \colon V \to W$ has a [dual map](/0AZ5ARP287/) $f^* \colon W^* \to V^*$,
      $f^*(\varphi) = \varphi \circ f$, which goes the other way. In dual bases its
      [matrix is the transpose](/0ZPB3180AY/) of the matrix of $f$. The last theorem proves
      $\ker f^* = (\operatorname{im} f)^0$ and $\operatorname{im} f^* = (\ker f)^0$, which gives a proof without
      coordinates that row rank equals column rank.
    entries:
      - 0AZ5ARP287
      - 0ZPB3180AY
      - 7FA499AW3T
