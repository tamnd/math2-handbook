# The order of chapter 3.18, positive definite matrices and the singular value decomposition. Groups are read in order; entries in a group too.
groups:
  - title: Positive definite and semidefinite matrices
    intro: >
      A Hermitian matrix $A$, or a real symmetric one, is positive definite when $x^* A x > 0$ for every
      nonzero vector $x$, and positive semidefinite when $x^* A x \ge 0$ for every $x$. Being Hermitian is
      part of both definitions. The two entries fix the definitions and show the first examples and
      non-examples.
    entries:
      - 0KX66CZMBB
      - 01MMVW8CKC
  - title: Three tests for definiteness
    intro: >
      For a Hermitian matrix $A$ there are three ways to decide definiteness. $A$ is positive definite
      exactly when all its eigenvalues are positive, and semidefinite exactly when they are all
      nonnegative. For every $m \times n$ matrix $B$, the Gram matrix $B^* B$ is positive semidefinite,
      it is definite exactly when the columns of $B$ are independent, and every positive semidefinite
      matrix has this form. By Sylvester's criterion, $A$ is positive definite exactly when its leading
      principal minors $\Delta_1, \dots, \Delta_n$ are all positive; for semidefiniteness all
      $2^n - 1$ principal minors must be nonnegative.
    entries:
      - 0HYC2RHD3M
      - 0AM050KCAW
      - 0WKEF78PMV
  - title: Cholesky, square roots and the polar decomposition
    intro: >
      A positive definite matrix $A$ has exactly one factorization $A = L L^*$ with $L$ lower triangular
      and with real positive diagonal entries. A positive semidefinite matrix $A$ has exactly one positive
      semidefinite square root $A^{1/2}$, and $A^{1/2} = p(A)$ for a real polynomial $p$. Every square
      matrix factors as $A = UP$ with $U$ unitary and $P = (A^* A)^{1/2}$; the factor $P$ is always unique,
      and $U$ is unique when $A$ is invertible.
    entries:
      - 0WKG8CYY6A
      - EQ98KW1ZN4
      - 0J2C7BDJQA
  - title: Singular values and the SVD
    intro: >
      The singular values of an $m \times n$ matrix $A$ are the square roots
      $\sigma_1 \ge \dots \ge \sigma_n \ge 0$ of the eigenvalues of $A^* A$. Every such $A$ factors as
      $A = U \Sigma V^*$ with $U$ and $V$ unitary and $\Sigma$ diagonal with the singular values in
      decreasing order; $\Sigma$ is unique, and the rank of $A$ is the number of nonzero singular values.
      Geometrically, $A$ maps the unit sphere onto an ellipsoid in its column space with semi-axes
      $\sigma_i u_i$.
    entries:
      - 09VMDSRXWJ
      - 000NPTMX6J
      - JAEKA59DNZ
  - title: Pseudoinverse, low-rank approximation and pairs of forms
    intro: >
      Every complex matrix $A$ has exactly one Moore-Penrose inverse $A^+$, the matrix that satisfies the
      four Penrose conditions, and $A^+ = V \Sigma^+ U^*$. If $A$ has rank $r$ and $0 \le k < r$, the
      truncated SVD $A_k$ is a nearest matrix of rank at most $k$, with error $\sigma_{k+1}$ in the
      operator norm and $(\sigma_{k+1}^2 + \dots + \sigma_r^2)^{1/2}$ in the Frobenius norm. If $A$ is
      Hermitian and $B$ is positive definite, one invertible $P$ gives $P^* B P = I$ and $P^* A P$ real
      diagonal.
    entries:
      - 0YY8VX28JR
      - JJT6GC055J
      - K559AQ9H67
