# The order of chapter 3.18, positive definite matrices and the singular value decomposition. Groups are read in order; entries in a group too.
groups:
  - title: Positive definite and semidefinite matrices
    intro: >
      A Hermitian matrix $A$ is positive definite when $x^* A x > 0$ for every nonzero $x$, and positive
      semidefinite when $x^* A x \ge 0$. These matrices play the part of positive and nonnegative numbers among
      matrices. The two definitions come first, with examples that show how easily a matrix with positive
      entries fails the test.
    entries:
      - 0KX66CZMBB
      - 01MMVW8CKC
  - title: Tests for definiteness
    intro: >
      Three tests decide definiteness without checking every vector. The eigenvalues must be positive; the
      matrix must be a Gram matrix $B^* B$ with independent columns; or, by Sylvester's criterion, the leading
      principal minors must be positive. The semidefinite case needs all principal minors, not only the
      leading ones.
    entries:
      - 0HYC2RHD3M
      - 0AM050KCAW
      - 0WKEF78PMV
  - title: Factorizations of positive matrices
    intro: >
      A positive definite matrix factors as $L L^*$ with $L$ lower triangular, which is the
      [Cholesky decomposition](/0WKG8CYY6A/), and every positive semidefinite matrix has exactly one positive
      semidefinite square root. The square root of $A^* A$ then gives the polar decomposition $A = UP$ of any
      square matrix, the matrix form of $z = e^{i\theta} r$.
    entries:
      - 0WKG8CYY6A
      - EQ98KW1ZN4
      - 0J2C7BDJQA
  - title: Singular values and the SVD
    intro: >
      The singular values of an $m \times n$ matrix $A$ are the square roots of the eigenvalues of $A^* A$.
      The singular value decomposition $A = U \Sigma V^*$ writes every matrix as a rotation, a stretch along
      the axes and another rotation. Geometrically, $A$ maps the unit circle onto an ellipse whose semi-axes are
      the singular values.
    entries:
      - 09VMDSRXWJ
      - 000NPTMX6J
      - JAEKA59DNZ
  - title: Pseudoinverse, low rank and pairs of forms
    intro: >
      The SVD gives the Moore-Penrose inverse $A^+$, which solves least-squares problems with the smallest
      norm, and the best approximation of $A$ by matrices of lower rank. The last entry diagonalizes a Hermitian
      matrix and a positive definite matrix at the same time, which is the generalized eigenvalue problem
      $A p = \lambda B p$.
    entries:
      - 0YY8VX28JR
      - JJT6GC055J
      - K559AQ9H67
