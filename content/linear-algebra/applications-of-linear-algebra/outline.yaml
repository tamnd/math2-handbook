# The order of chapter 3.21, applications of linear algebra. Groups are read in order; entries in a group too.
groups:
  - title: Linear systems in models
    intro: >
      Conservation laws at the junctions of a network, the atoms of a chemical reaction and the balance of an
      economy each give one linear equation per node or element, so the model is a system $Ax = b$ solved by row
      reduction. Interpolation is the square case: for $n + 1$ distinct nodes in a field there is exactly one
      polynomial of degree at most $n$ through the given values, because the Vandermonde matrix is invertible.
      Fitting is the overdetermined case: for a real matrix $A$ the normal equations $A^{\mathsf T} A c = A^{\mathsf T} y$
      always have a solution, and $Ac$ is the orthogonal projection of $y$ onto the column space.
    entries:
      - 1QXFM0DNAH
      - NR58EBS932
      - C170QFW8QB
  - title: Evolution in discrete and continuous time
    intro: >
      A process that moves in steps follows $x_{k+1} = A x_k$, so $x_k = A^k x_0$. If $A$ is diagonalizable with
      eigenpairs $(\lambda_i, v_i)$, then $x_k = \sum_i c_i \lambda_i^k v_i$, and the eigenvalues of largest
      absolute value decide the long run. Linear recurrences, population models, Markov chains and PageRank
      are all of this form; the system $x' = Ax$ is the continuous analogue, with $e^{\lambda_i t}$ in place of
      $\lambda_i^k$.
    entries:
      - K00NJY6C33
      - 2F1B461YN7
      - Y9FRWY8YX4
      - 9ZPQYZ5NDP
      - DH7CQXQYJX
  - title: Coordinates for pictures and signals
    intro: >
      Adding one homogeneous coordinate turns translations into matrices, so a chain of motions of the plane
      or of space is a single matrix product, read from right to left. A signal is a vector, and an orthonormal
      basis such as the Fourier or Haar basis keeps lengths, so dropping small coordinates costs exactly their
      squared size. For a single image matrix the best rank-$k$ approximation, in the Frobenius norm and the
      operator norm, is the sum of the first $k$ terms of the singular value decomposition.
    entries:
      - REB4ZHN28T
      - 6NANBCYMG2
      - 9QB82PPEMV
  - title: Puzzles and graphs
    intro: >
      Row reduction works over every field, and the Lights Out puzzle is a linear system over $\mathbb F_2$
      whose matrix is symmetric, so a pattern can be switched off exactly when it is orthogonal to every quiet
      pattern. The adjacency, incidence and Laplacian matrices of a graph turn walks, cycles and Kirchhoff's laws
      for electrical networks into matrix powers, null spaces and ranks.
    entries:
      - E8DZ9CPEEE
      - JFWP2SBCF0
