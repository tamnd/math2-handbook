# The order of chapter 3.4, invertible matrices and matrix factorizations. Groups are read in order; entries in a group too.
groups:
  - title: Inverses
    intro: >
      A square matrix $A$ over a field is invertible when some $B$ satisfies $AB = BA = I_n$, and then $B$ is unique
      and written $A^{-1}$. The $2 \times 2$ case has an explicit formula, and products invert in reverse order:
      over a commutative ring, if $A$ and $B$ are invertible then $(AB)^{-1} = B^{-1} A^{-1}$. For square matrices
      over a field, one of the equations $AB = I_n$ and $BA = I_n$ already implies the other.
    entries:
      - 0EB9N0S33C
      - 8XWC7RKNN1
      - 0S4WTRE9GG
      - 0753Y2X5K6
  - title: Elementary matrices and row reduction
    intro: >
      Each row operation is multiplication on the left by an elementary matrix, and each elementary matrix is
      invertible. For an $n \times n$ matrix $A$ over a field, the main theorem says that $A$ is invertible if and
      only if $Ax = 0$ has only the trivial solution, if and only if the reduced row echelon form of $A$ is $I_n$,
      if and only if $A$ is a product of elementary matrices. Reducing $[A \mid I_n]$ to $[I_n \mid A^{-1}]$
      computes the inverse, and then $Ax = b$ has the single solution $x = A^{-1} b$.
    entries:
      - 01REXW3WWE
      - 1ZK55FS2BF
      - 0Z83DHFMYM
      - 3RQX3T70NX
  - title: The invertible matrix theorem
    intro: >
      For an $n \times n$ matrix $A$ over a field, twenty-two conditions are equivalent to invertibility. They
      include a one-sided inverse, $n$ pivots, independent or spanning columns, rank $n$, $\det A \ne 0$ and $0$
      not being an eigenvalue. For a triangular matrix over a field the test is on the diagonal: it is invertible
      if and only if no diagonal entry is zero, and its inverse is triangular of the same kind.
    entries:
      - ACDFDABVQK
      - 7X1B65CTG4
  - title: The general and special linear groups
    intro: >
      Over a commutative ring $R$, the invertible $n \times n$ matrices form the group $\mathrm{GL}_n(R)$, and over
      a field the matrices of determinant $1$ form its subgroup $\mathrm{SL}_n(F)$. A transvection is
      $T_{ij}(c) = I_n + c E_{ij}$ with $i \ne j$. The main theorem holds over a field $F$: every
      $A \in \mathrm{GL}_n(F)$ is a product of transvections times $\operatorname{diag}(1, \dots, 1, \det A)$, so
      the transvections generate $\mathrm{SL}_n(F)$.
    entries:
      - 0FCHE902D7
      - 0V9PMN0RBH
      - 0DTCBCKEJP
      - YSS4XNY9RC
  - title: LU, the Schur complement and low-rank updates
    intro: >
      Elimination without row exchanges writes a square matrix over a field as $A = LU$, with $L$ unit lower
      triangular and $U$ upper triangular. This works whenever the leading principal minors
      $\Delta_1, \dots, \Delta_{n-1}$ are nonzero, and for invertible $A$ the factorization is unique. Elimination
      with a whole invertible block $A$ of $M = \begin{pmatrix} A & B \\ C & D \end{pmatrix}$ leaves the Schur
      complement $D - CA^{-1}B$, and $M$ is then invertible if and only if the complement is. The
      Sherman-Morrison-Woodbury formula inverts $A + UCV$ for invertible $A$ and $C$ when
      $C^{-1} + VA^{-1}U$ is invertible.
    entries:
      - 0RKG5YW66Y
      - 6HWFBXYPZP
      - MDZDEFE53C
  - title: Equivalence and rank
    intro: >
      Two $m \times n$ matrices $A$ and $B$ over a field are equivalent when $B = PAQ$ with $P$ and $Q$ invertible.
      By the rank normal form theorem, a matrix of rank $r$ is equivalent to $\begin{pmatrix} I_r & 0 \\ 0 & 0 \end{pmatrix}$,
      so two matrices of the same size are equivalent if and only if they have the same rank.
    entries:
      - 0CMHSGTWXB
