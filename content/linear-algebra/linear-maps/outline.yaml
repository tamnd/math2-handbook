# The order of chapter 3.6, linear maps. Groups are read in order; entries in a group too.
groups:
  - title: Linear maps and their examples
    intro: >
      A linear map is a function between vector spaces that respects addition and scalar multiplication. The
      first entries give the definition with its non-examples, then the standard examples: derivatives,
      integrals, shifts, the maps $x \mapsto Ax$, and the rotations, reflections, shears and projections of the
      plane. Composites of linear maps are linear, and for matrix maps composition is the matrix product.
    entries:
      - 0NRYHJPQG2
      - 0SS770NS8B
      - W6KB0J3SZZ
      - 5BXHREC8C8
      - 00BKRZKMSS

  - title: Kernel and image
    intro: >
      Every linear map $T \colon V \to W$ has two subspaces attached: the kernel, the vectors sent to $0$, and the
      image, the values taken. The kernel decides injectivity: $T$ is one-to-one exactly when
      $\ker T = \set{0}$.
    entries:
      - 0S23E6YE83
      - 0WSFKKT6FF
      - 0BJBYCGMWE

  - title: Bases, rank and nullity
    intro: >
      A linear map is fixed by its values on a basis, and these values can be chosen freely. The rank and the
      nullity are the dimensions of the image and of the kernel, and the [rank-nullity theorem](/0W4FSW1TVB/)
      says that they add up to the dimension of the domain.
    entries:
      - 0R8X9XA83A
      - 0ZZXSBTR4J
      - 0APCFW7639
      - 0W4FSW1TVB

  - title: Isomorphisms
    intro: >
      A bijective linear map is an isomorphism, and its inverse is again linear. Finite-dimensional spaces over
      the same field are isomorphic exactly when they have the same dimension. For a map from a
      finite-dimensional space to itself, injective, surjective and bijective are the same condition.
    entries:
      - 0B8T10CE7N
      - 0VJBSK15SN
      - 0912EEEVCT

  - title: Spaces of maps and the algebra of endomorphisms
    intro: >
      The linear maps from $V$ to $W$ form a vector space $\operatorname{Hom}(V, W)$ of dimension
      $\dim V \cdot \dim W$. The maps from a space to itself can also be composed, and with composition as
      product they form an algebra, which a basis identifies with the matrix algebra $M_n(F)$.
    entries:
      - 0X9MBPP2Z3
      - 0Z9N1ER0W0
      - 0J7H0YBFDJ
      - 5JA4CYT1TB

  - title: Semilinear maps
    intro: >
      A semilinear map is additive but moves scalars by an automorphism of the field, as in
      $T(\lambda v) = \bar\lambda\, T(v)$ over $\C$. Such maps appear with complex conjugation and in projective
      geometry.
    entries:
      - BNPDDM95KF
