# The order of chapter 3.12, diagonalization, triangularization and invariant subspaces. Groups are read in order; entries in a group too.
groups:
  - title: Invariant subspaces
    intro: >
      A subspace $U$ with $T(U) \subseteq U$ lets you cut $T$ into two smaller maps: the restriction to $U$
      and the induced map on $V / U$. In a basis that starts with a basis of $U$ the matrix of $T$ is block
      upper triangular, and the characteristic polynomial of $T$ is the product of those of the two pieces.
    entries:
      - 0ACX5QT8TE
      - 0KN7EPH7Z0
  - title: When a map is diagonalizable
    intro: >
      A map is diagonalizable when some basis consists of eigenvectors. Three tests decide it: $n$ distinct
      eigenvalues (sufficient, not necessary), equal geometric and algebraic multiplicities once $p_T$
      splits, and a minimal polynomial that splits with simple roots. The last entry collects the matrices
      that fail, and the two different reasons why.
    entries:
      - 07SQCNV233
      - 056SW1E0AC
      - 0Y95Z7MT02
      - CDB8KCNNG9
      - 0MPAJRB23T
      - 5F2AV5855Y
  - title: Using a diagonalization
    intro: >
      Once $A = P D P^{-1}$, every polynomial in $A$ is computed on the diagonal. The eigendecomposition
      writes $A$ as a sum of eigenvalues times rank-one matrices, and the powers $A^k = P D^k P^{-1}$ give
      closed formulas for linear recurrences and the long-term behaviour of linear models.
    entries:
      - D0AP2R7272
      - 0TNR9BQ871
  - title: Commuting families and triangular forms
    intro: >
      Commuting diagonalizable maps share one basis of eigenvectors. A map that is not diagonalizable can
      still be made upper triangular exactly when its characteristic polynomial splits, and commuting maps
      over $\C$ can be made upper triangular together.
    entries:
      - 0FK17N4DKA
      - 0363JMQ42Y
      - 42PG67Q5YN
  - title: Splitting the space with polynomials
    intro: >
      If $p$ and $q$ are coprime, the kernel of $(pq)(T)$ is the direct sum of the kernels of $p(T)$ and
      $q(T)$, with projections that are polynomials in $T$. Applied to the factorization of the minimal
      polynomial, this [kernels lemma](/ACBNK1VFVG/) gives the primary decomposition, over any field.
    entries:
      - ACBNK1VFVG
      - 49ZHBMYKVE
  - title: Generalized eigenvectors
    intro: >
      When eigenspaces are too small, vectors killed by a power of $T - \lambda$ fill the gap. The generalized
      eigenspace of $\lambda$ always has dimension equal to the algebraic multiplicity, and when $p_T$ splits
      the space is the direct sum of the generalized eigenspaces.
    entries:
      - 01H6QKWGDH
      - 0AJ035ZTZE
      - 0Z3GDY89T5
  - title: Nilpotent and semisimple parts
    intro: >
      A nilpotent map has a vanishing power; a semisimple map has an invariant complement for every
      invariant subspace. The Jordan-Chevalley decomposition writes a map with split characteristic
      polynomial as a commuting sum of a diagonalizable and a nilpotent part, both polynomials in the map.
      The Fitting decomposition splits off the nilpotent and the invertible behaviour of a single map.
    entries:
      - 063D5Z2C70
      - 08VRX3Q4PB
      - 011K11VPJN
      - 77SACA9CVQ
