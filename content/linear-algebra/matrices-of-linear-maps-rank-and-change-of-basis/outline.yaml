# The order of chapter 3.8, matrices of linear maps, rank and change of basis. Groups are read in order; entries in a group too.
groups:
  - title: Matrices and linear maps
    intro: >
      Fix a basis $B$ of an $n$-dimensional space $V$ and a basis $C$ of an $m$-dimensional space $W$. The
      [matrix of a linear map](/0YQSGNYE3K/) $f \colon V \to W$ has as its columns the coordinates of the images
      of the basis vectors, and this gives an isomorphism $\operatorname{Hom}(V, W) \cong M_{m \times n}(F)$. The
      group proves that the matrix of a composition is the product of the matrices, which is the reason for the
      rule of matrix multiplication.
    entries:
      - 0YQSGNYE3K
      - 06HMCTAQH3
      - 05Q1B7MH0M

  - title: The four subspaces of a matrix
    intro: >
      An $m \times n$ matrix $A$ of rank $r$ has a column space and a left null space in $F^m$, and a row space
      and a null space in $F^n$. Row reduction gives a basis of each: the pivot columns of $A$, the nonzero rows
      of an echelon form, and one vector per free variable. The
      [theorem on the four fundamental subspaces](/73DVECPAT6/) proves that their dimensions are $r$, $m - r$,
      $r$ and $n - r$.
    entries:
      - 03AJKXH1AV
      - 069MCGX635
      - 0PHDYNR24D
      - 73DVECPAT6

  - title: Rank
    intro: >
      The [rank](/0ZC9YTXZRY/) of a matrix is the dimension of its column space, and the group proves that it
      is also the dimension of the row space, by several arguments. It then proves
      $\operatorname{rank} A + \operatorname{nullity} A = n$ for an $m \times n$ matrix, bounds the rank of a
      product by the ranks of its factors, and writes a matrix of rank $r$ as a product $CR$ of an $m \times r$
      and an $r \times n$ matrix, or as a sum of $r$ matrices of rank one.
    entries:
      - 0ZC9YTXZRY
      - 0TZAG60ZYT
      - TR48YQGCCA
      - 02FDWY55AS
      - 5JGAG62VN8

  - title: Change of basis and similarity
    intro: >
      A [change of basis matrix](/0MKRHZB3WS/) converts coordinates in one basis into coordinates in another.
      The [change of basis formula](/0MQXVZEBMT/) proves that the matrix of a map becomes $Q^{-1}AP$, and the
      matrix of an endomorphism becomes $P^{-1}AP$, so the matrices of one endomorphism form a class of
      [similar matrices](/0E89HQATM8/). Similar matrices share rank, trace, determinant and characteristic and
      minimal polynomials, but the last entry of the group shows that these invariants do not decide similarity.
    entries:
      - 0MKRHZB3WS
      - 0MQXVZEBMT
      - 0E89HQATM8
      - J4Q3B9ZNHF

  - title: Trace and the Fredholm alternative
    intro: >
      Since similar matrices have the same trace, the [trace of a linear map](/0KZDNGA561/) on a
      finite-dimensional space is well defined, and for a projection it counts the dimension of the image when
      the field has characteristic $0$. The [Fredholm alternative](/4HH8C9V8JQ/) proves that $Ax = b$ has a
      solution exactly when $y^{\mathsf{T}} b = 0$ for every solution $y$ of $A^{\mathsf{T}} y = 0$.
    entries:
      - 0KZDNGA561
      - 4HH8C9V8JQ
