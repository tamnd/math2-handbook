# The order of chapter 3.17, isometries and the orthogonal and unitary groups. Groups are read in order; entries in a group too.
groups:
  - title: Linear isometries and orthogonal matrices
    intro: >
      A linear isometry is a linear map $T$ between normed spaces with $\norm{Tv} = \norm{v}$ for every $v$.
      Between inner product spaces, the polarization identities show that it then keeps inner products, and on
      a real inner product space every map $f$ with $f(0) = 0$ that keeps distances is automatically linear.
      In $\R^n$ with the dot product the linear isometries are the orthogonal matrices, those with
      $Q^{\mathsf{T}}Q = I$, or equivalently with orthonormal columns.
    entries:
      - 07SJXTWVQW
      - 0R7VXTYHYZ
      - 0W02QESPJQ
  - title: The orthogonal groups
    intro: >
      The orthogonal $n \times n$ matrices form a group $O(n)$ under multiplication, the group of linear
      isometries of $\R^n$. The determinant of an orthogonal matrix is $\pm 1$, so $\det$ is a homomorphism
      onto $\set{1, -1}$, and its kernel $SO(n)$, the group of rotations, is a normal subgroup of index $2$.
    entries:
      - WWK2E8BRGF
      - 6WBVP2PB1Y
  - title: The unitary groups
    intro: >
      Over $\C$ the same construction uses the conjugate transpose: a complex square matrix $U$ is unitary when
      $U^*U = I$, and the unitary matrices form the group $U(n)$ of linear isometries of $\C^n$. The
      determinant maps $U(n)$ onto the unit circle $U(1)$, and its kernel is $SU(n)$. For $n = 2$ the elements
      of $SU(2)$ are the matrices $\begin{pmatrix} \alpha & \beta \\ -\bar\beta & \bar\alpha \end{pmatrix}$ with
      $\abs{\alpha}^2 + \abs{\beta}^2 = 1$, a copy of the unit quaternions.
    entries:
      - 0AR68JTMDT
      - VW5H9XFNJB
      - ZRYYPHWESP
  - title: Rotations and reflections in the plane and in space
    intro: >
      Rotations of the plane and the basic rotations of space are written down, together with the reflection
      $s_u(x) = x - 2\frac{\ip{x}{u}}{\ip{u}{u}}u$ in the hyperplane $u^\perp$, for $u \ne 0$, and the Householder
      matrices $I - 2uu^{\mathsf{T}}$ for a unit vector $u$. The groups of the second group are then described
      completely for $n = 2$ and $n = 3$. Every element of $O(2)$ is a rotation $R(\theta)$ or a reflection
      $S(\alpha)$ in a line, and two reflections compose to a rotation by twice the angle between their lines.
      Every element of $SO(3)$ fixes a unit vector $u$ and turns the plane $u^\perp$ by an angle $\theta$ with
      $\tr R = 1 + 2\cos\theta$ (Euler's rotation theorem), and every element of $O(3)$ of determinant $-1$ is
      $-1$ times a rotation.
    entries:
      - HNY4CPEEJA
      - 06BRDF3F0E
      - C97Z06HHB2
      - 2ZVG43GSKA
  - title: Orthogonal maps in every dimension
    intro: >
      The real normal form of a normal operator, applied to an orthogonal matrix $Q$, gives an orthonormal basis
      in which $Q$ is $\operatorname{diag}(R(\theta_1), \dots, R(\theta_k), -I_q, I_p)$, with $\det Q = (-1)^q$.
      The Cartan–Dieudonné theorem says that every element of $O(n)$ is a product of at most $n$ reflections,
      generalizing the plane case of the previous group. Finally, for a real skew-symmetric matrix $A$ the
      Cayley transform $(I - A)(I + A)^{-1}$ is a rotation, and it is a bijection onto the rotations without the
      eigenvalue $-1$, so rational skew matrices give rotations with rational entries.
    entries:
      - QTY3VMFGY1
      - 0VMWGYY35Q
      - HKQ5YY027B
