  - title: The laws of the product and the matrix ring
    intro: >
      The product obeys most of the laws of numbers, but not all. The main theorem is
      [associativity](/073E4XC016/): for matrices $A$, $B$, $C$ over any ring $R$, of sizes $m \times n$,
      $n \times p$ and $p \times q$, one has $(AB)C = A(BC)$, and no commutativity of $R$ is needed.
      Commutativity fails for the matrices themselves as soon as $n \ge 2$, so the square matrices of order $n$
      form the [matrix ring](/AB2MD5CD13/) $M_n(R)$, which is not commutative and has zero divisors. Its centre
      consists of the scalar matrices $cI_n$ with $c$ in the centre of $R$.
    entries:
      - 073E4XC016
      - 0P506SPZP2
      - AB2MD5CD13
      - 067NKSBEWT
  - title: Diagonal and triangular matrices
    intro: >
      Some shapes of square matrices are closed under the product, and they make computation easy. Diagonal
      matrices multiply entry by entry. The main theorem is the triangular product rule: over any ring $R$, if
      $A$ and $B$ are upper triangular $n \times n$ matrices, then $AB$ is upper triangular with
      $(AB)_{ii} = a_{ii} b_{ii}$, and a strictly upper triangular $N$ satisfies $N^n = 0$. The same holds for
      lower triangular matrices.
    entries:
      - 044JNC7ZAA
      - 0N4XY7Z3NN
  - title: The transpose and the conjugate transpose
    intro: >
      The transpose turns rows into columns. The main theorem is the
      [transpose of a product](/09GK5PS824/): over a commutative ring $R$, for an $m \times n$ matrix $A$ and an
      $n \times p$ matrix $B$, one has $(AB)^{\mathsf{T}} = B^{\mathsf{T}} A^{\mathsf{T}}$. With it the group
      studies the symmetric matrices ($A^{\mathsf{T}} = A$) and the skew-symmetric ones ($A^{\mathsf{T}} = -A$),
      and then repeats the story over $\mathbb{C}$ with the conjugate transpose $A^*$, which satisfies
      $(AB)^* = B^* A^*$ and defines the Hermitian matrices ($A^* = A$).
    entries:
      - 09DXWYRD43
      - 09GK5PS824
      - 0VR671PHE5
      - 0PBY4E9GQF
