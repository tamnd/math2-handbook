      - 0P17NGQQMQ
  - title: Block matrices
    intro: >
      Cutting a matrix by full horizontal and vertical lines turns it into a matrix of smaller matrices, and the
      product still works with blocks in place of entries. The main theorem is the block multiplication rule: if
      the column cuts of $A$ match the row cuts of $B$, then $(AB)_{ik} = \sum_j A_{ij} B_{jk}$, with the order of
      each product kept. For block diagonal matrices this means that sums, products, powers and inverses are
      computed one block at a time.
    entries:
      - 0ASDFEQS6P
      - 001T5FJDC1
  - title: The trace
    intro: >
      The trace is the sum of the diagonal entries, a linear function of a square matrix. Its main property is
      the [cyclic property](/0Y4NF1DRKD/): over a commutative ring, for an $m \times n$ matrix $A$ and an
      $n \times m$ matrix $B$, one has $\operatorname{tr}(AB) = \operatorname{tr}(BA)$. Over a field of
      characteristic $0$ it follows that $AB - BA = I$ has no solution.
    entries:
      - 0XC1RDBY7A
      - 0Y4NF1DRKD
  - title: Powers, commuting matrices and matrix units
    intro: >
      Some square matrices are defined by one polynomial equation: $N^k = 0$ (nilpotent), $P^2 = P$ (idempotent)
      and $A^2 = I$ (involutory). For a nilpotent $N$ with $N^k = 0$, the matrix $I - N$ is invertible with
      inverse $I + N + \dots + N^{k-1}$. Pairs with $AB = BA$ over a commutative ring satisfy the binomial theorem
      $(A + B)^m = \sum_k \binom{m}{k} A^k B^{m-k}$. The matrix units $E_{ij}$ form the standard basis of the
      $m \times n$ matrices and multiply by the rule $E_{ij} E_{kl} = \delta_{jk} E_{il}$.
    entries:
