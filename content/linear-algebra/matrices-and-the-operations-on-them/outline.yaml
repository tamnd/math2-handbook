# The order of chapter 3.3, matrices and the operations on them. Groups are read in order; entries in a group too.
groups:
  - title: Matrices, sums and products
    intro: >
      A matrix is a rectangular array of entries from a ring. The group names the square matrices, the zero
      matrix and the identity, and defines the sum of two matrices of the same size, the product of a matrix and
      a column vector, and the product of an $m \times n$ and an $n \times p$ matrix. The key fact is the column
      rule: for an $m \times n$ matrix $A$ with columns $a_1, \dots, a_n$ and a vector $x = (x_1, \dots, x_n)$,
      the product is $Ax = x_1 a_1 + \dots + x_n a_n$, and column $j$ of $AB$ is $A$ times column $j$ of $B$.
      The identity satisfies $I_m A = A = A I_n$ for every $m \times n$ matrix $A$.
    entries:
      - 0VD9ZSWWJG
      - 0JXZKX526R
      - 0ZTKJJDGR7
