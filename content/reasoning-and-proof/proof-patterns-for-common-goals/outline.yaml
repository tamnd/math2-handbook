groups:
  - title: Equalities and properties of maps and relations
    intro: >
      Many goals in algebra and basic set theory have a fixed shape: two sets are equal, a map is injective,
      a relation is an equivalence, two numbers are equal, an identity holds for every value of a variable.
      Each shape has a standard proof, and the definitions say what that proof must check. The entries give
      the pattern, the usual pitfalls and the failures that show why each check is needed.
    entries:
      - MKHVRNW68H
      - DD2P85Y8E9
      - RGNF33GVHX
      - S3QADD13E9
      - XP5SDYKJX0
  - title: Estimates in analysis
    intro: >
      Limits and continuity are statements of the form "for every $\varepsilon > 0$ there is a $\delta > 0$".
      The epsilon-delta pattern proves them by working backwards from the target inequality. The
      $\varepsilon/3$ argument passes a property through a uniform limit, and the density argument extends an
      identity or an estimate from a dense set to the whole space.
    entries:
      - RXG5JTZ2PZ
      - VXV7M0QDH6
      - J2J35J3055
  - title: Reducing the work
    intro: >
      Two patterns shrink a problem before it is attacked. A symmetry of the statement fixes the answer or pairs
      terms so that they cancel. A transformation that preserves the claim, such as scaling or a change of
      variable, reduces the general case to a special one.
    entries:
      - H840D9TM2X
      - DX2H7AD66G
  - title: From local to global
    intro: >
      Some properties are easy to check near one point and hard to check everywhere. The open-closed argument
      shows that the set where a property holds is open, closed and non-empty, so it is the whole connected
      space. Bootstrapping turns a weak a priori bound into a strong one by a continuity argument in time or in
      a parameter.
    entries:
      - 1JJCDJB7FM
      - YKA0ADKYFR
  - title: Existence by procedure
    intro: >
      A procedure that always stops and always returns a correct output proves that the output exists. The
      proof has two parts: termination, by a natural number that decreases, and correctness, by an invariant.
    entries:
      - X5HG1RNWQX
