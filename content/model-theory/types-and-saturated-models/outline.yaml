# The order of chapter 4.5, types and saturated models. Groups are read in order; entries in a group too.
groups:
  - title: Types and type spaces
    intro: >
      A type over a set $A$ is a set of formulas with parameters from $A$ that is consistent with what the
      structure says about $A$. The complete $n$-types over $A$ form the Stone space $S_n(A)$, which is
      compact because first-order logic is. Every type is realized in some elementary extension, and many
      types can be realized at once.
    entries:
      - 9V71Q3SD1G
      - VDY4PG5WHN
      - 8R31F7BQGY
  - title: Isolated and omitted types
    intro: >
      A type is isolated when one formula implies all of it, and then every model of a complete theory
      realizes it. In a countable language the converse is the [omitting types theorem](/7MFGBVDVG9/):
      countably many non-isolated types can be omitted together in a countable model.
    entries:
      - A0VNTN725W
      - 7MFGBVDVG9
  - title: Algebraic and definable closure
    intro: >
      An element is algebraic over $A$ when a formula over $A$ holds of it and has finitely many solutions,
      and definable over $A$ when it is the only solution. In an algebraically closed field these closures
      are the algebraic closure and the perfect closure of the field generated by $A$. An element is
      algebraic over $A$ exactly when its type over $A$ contains a formula with finitely many solutions.
    entries:
      - DKAGC639W9
  - title: Saturated models
    intro: >
      A $\kappa$-saturated model realizes every type over fewer than $\kappa$ of its own elements. Every
      model has $\kappa^+$-saturated elementary extensions, but saturated models of a given size depend on
      cardinal arithmetic or on stability: the dense linear order has one of size $\aleph_1$ exactly under
      the continuum hypothesis.
    entries:
      - RMTZ5J64FX
      - GSQ833HAZT
  - title: Homogeneity, universality and weaker saturation
    intro: >
      Saturation splits into two halves. A homogeneous model extends partial elementary maps, and a
      universal model contains an elementary copy of every smaller model of its theory. Special models and
      recursively saturated models keep enough of saturation for many proofs and exist with no assumption
      on cardinal arithmetic.
    entries:
      - 4NJS7W57VK
      - F30ZVR4AD5
      - CBNPB0QZGQ
      - ZGEXNRHC9M
  - title: The monster model and automorphisms
    intro: >
      Later chapters work inside one large saturated and strongly homogeneous model. There a type over a
      small set is the same thing as an orbit of the automorphisms that fix the set. Rigid structures show
      how far a structure without symmetry can be from this picture.
    entries:
      - EYTTQZ0E1S
      - EPNZKJQHWJ
      - 7WH24MZZQ8
