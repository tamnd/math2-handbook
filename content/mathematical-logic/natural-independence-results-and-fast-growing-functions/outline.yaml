# The order of chapter 2.12, natural independence results and fast-growing functions. Groups are read in order; entries in a group too.
groups:
  - title: Goodstein's theorem and growth
    intro: >
      Goodstein sequences rewrite numbers in hereditary base notation, and they always reach $0$, although
      Peano arithmetic cannot prove it. Each step lowers an ordinal below $\varepsilon_0$, and that is the proof
      of termination. The provably total functions of a theory form a class that a fast-growing function can
      escape, and then the theory cannot prove that function total.
    entries:
      - XQMNJF241J
      - Z742YPHPNS
  - title: Hierarchies of functions
    intro: >
      Ordinal-indexed hierarchies measure the strength of a theory by growth rate. The fast-growing
      hierarchy $f_\alpha$ and the Hardy hierarchy $H_\alpha$ are linked by $H_{\omega^\alpha} = f_\alpha$, and
      the functions below $\varepsilon_0$ are exactly the bounds on what $\mathsf{PA}$ proves total. The slow-growing
      hierarchy $g_\alpha$ grows much more slowly and depends strongly on the fundamental sequences.
    entries:
      - R6ZC4BJGXV
      - X8RKXQASR9
      - VDF6R9EVJ2
  - title: Hydras and worms
    intro: >
      Two more processes that always stop, although $\mathsf{PA}$ cannot prove it. The Kirby-Paris hydra cuts
      heads from a finite tree, and Beklemishev's worm principle, which comes from provability logic, cuts
      letters from a word. Both stop because each step lowers an ordinal below $\varepsilon_0$.
    entries:
      - C028FF4TWM
      - MHDZGDNEPS
  - title: Ramsey-type statements
    intro: >
      The strengthened finite Ramsey theorem asks for a homogeneous set that is large, with at least
      as many elements as its least element. This small change turns a theorem of $\mathsf{PA}$ into one that
      $\mathsf{PA}$ cannot prove. Indicators, functions that are large exactly on the intervals that contain
      models of a theory, are the original tool of that proof. The Kanamori-McAloon principle gives a second
      statement of the same strength with regressive colorings.
    entries:
      - 4P2BAT6YC3
      - 509ZWA0R26
      - JWTZ8NVVGK
      - NM5WYBK6BG
  - title: Beyond Peano arithmetic
    intro: >
      The Buchholz hydra, a finite form of Kruskal's tree theorem and a finite form of the graph minor theorem
      go far beyond $\mathsf{PA}$. The tree and graph statements bound the length of a sequence of trees or graphs
      that grow by one at each step, and they are unprovable in $\mathsf{ATR}_0$ and in $\Pi^1_1\text{-}\mathsf{CA}_0$.
      The Buchholz hydra escapes the still stronger theory $(\Pi^1_1\text{-}\mathsf{CA}) + \mathsf{BI}$.
    entries:
      - 9APRFM0G7F
      - 12XRGBWH59
      - WXNTPQGJ38
  - title: The general picture
    intro: >
      The last entry gathers the examples under one heading, concrete incompleteness, and states what they
      have in common.
    entries:
      - E2H655A7BS
